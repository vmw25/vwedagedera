{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" | default "" -}}
{{- $caption := .Get "caption" -}}
{{- $image := .Page.Resources.GetMatch $src -}}

<figure>
  {{- if and $image (reflect.IsImageResourceProcessable $image) -}}
    {{- $targetWidth := 1200 -}}
    {{- if lt $image.Width $targetWidth -}}
      {{- $targetWidth = $image.Width -}}
    {{- end -}}
    {{- $fallback := $image.Resize (printf "%dx webp q80" $targetWidth) -}}
    {{- $srcset := slice -}}
    {{- range slice 480 720 960 1200 -}}
      {{- if le . $image.Width -}}
        {{- $resized := $image.Resize (printf "%dx webp q78" .) -}}
        {{- $srcset = $srcset | append (printf "%s %dw" $resized.RelPermalink .) -}}
      {{- end -}}
    {{- end -}}
    {{- if eq (len $srcset) 0 -}}
      {{- $srcset = $srcset | append (printf "%s %dw" $fallback.RelPermalink $fallback.Width) -}}
    {{- end }}
    <img
      src="{{ $fallback.RelPermalink }}"
      srcset="{{ delimit $srcset ", " }}"
      sizes="(max-width: 760px) calc(100vw - 36px), 720px"
      width="{{ $fallback.Width }}"
      height="{{ $fallback.Height }}"
      loading="lazy"
      decoding="async"
      alt="{{ $alt }}"
    >
  {{- else }}
    <img src="{{ $src | safeURL }}" loading="lazy" decoding="async" alt="{{ $alt }}">
  {{- end }}
  {{- with $caption }}
    <figcaption>{{ . | markdownify }}</figcaption>
  {{- end }}
</figure>
