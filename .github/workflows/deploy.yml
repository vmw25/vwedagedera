name: Deploy website to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: ['main']
  # Allows you to run this workflow manually from the Actions tab on GitHub
  workflow_dispatch:

# Provide permission to clone the repo and deploy it to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    if: github.repository_owner != 'HugoBlox'
    uses: ./.github/workflows/build.yml
    secrets: inherit

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  notify-subscribers:
    name: Notify newsletter subscribers
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.KIT_NEWSLETTER_ENABLED == 'true'
    needs: deploy
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout article history
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Verify Kit API connection
      env:
        KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
      run: |
        node --input-type=module -e "
          const response = await fetch('https://api.kit.com/v4/broadcasts?per_page=1', {
            headers: { 'X-Kit-Api-Key': process.env.KIT_API_KEY || '' }
          });
          if (!response.ok) throw new Error('Kit API connection failed with HTTP ' + response.status);
          console.log('Kit API connection verified.');
        "

    - name: Test newsletter publisher
      run: node --test scripts/newsletter/*.test.mjs

    - name: Publish new article notifications
      env:
        AFTER_SHA: ${{ github.sha }}
        BEFORE_SHA: ${{ github.event.before }}
        KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        NEWSLETTER_RSS_URL: https://vidunwedagedera.com/articles/index.xml
        NEWSLETTER_SEND_DELAY_MINUTES: '10'
        NEWSLETTER_SEND_SPACING_MINUTES: '10'
        NEWSLETTER_SITE_URL: https://vidunwedagedera.com/
      run: node scripts/newsletter/publish-new-articles.mjs
