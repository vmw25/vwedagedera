  - id: 'experience'
    label: 'Experience'
    title: 'Professional experience'
    introduction: 'Teaching, biomedical research, healthcare consulting and medical education.'
    entries:
      - title: 'Part II Biochemistry Supervisor'
        organisation: 'Robinson College, University of Cambridge'
        period: 'Oct 2025–Present'
        badge: 'Teaching'
        summary: 'Paid small-group teaching and assessment for Part II Biochemistry undergraduates.'
        featured: true
        points:
          - 'Supervise Part II Biochemistry students across Natural Sciences and Medical and Veterinary Sciences.'
          - 'Deliver small-group teaching sessions and mark essays.'
        tags:
          - 'Teaching'
          - 'Biochemistry'
          - 'Academic feedback'
      - title: 'Life Sciences Summer Analyst Intern'
        organisation: 'Candesic'
        period: 'Aug–Sept 2025'
        badge: 'Consulting'
        summary: 'Commercial due diligence and strategic analysis across healthcare services and medtech.'
        points:
          - 'Contributed to commercial due-diligence projects for private-equity clients evaluating healthcare service providers and medtech innovations.'
          - 'Performed market analysis, competitor benchmarking and financial modelling to support investment decisions.'
        tags:
          - 'Due diligence'
          - 'Market analysis'
          - 'Financial modelling'
      - title: 'Summer Intern'
        organisation: 'Milner Therapeutics Institute / AstraZeneca'
        period: 'July–Sept 2025'
        badge: 'Research'
        summary: 'Exploratory inflammatory-bowel-disease drug-target research using transcriptomic analysis.'
        points:
          - 'Applied differential gene-expression analysis in R and Python across bulk and single-cell RNA-sequencing data.'
          - 'Supported exploratory work investigating disease-specific cellular interaction signatures for targeted drug discovery.'
        tags:
          - 'R'
          - 'Python'
          - 'Single-cell RNA-seq'
          - 'Drug discovery'
      - title: 'Wellcome Trust Summer Intern'
        organisation: 'Cardiovascular Research Unit, University of Sheffield'
        period: 'Jun–Aug 2024'
        badge: 'Cardiovascular research'
        summary: 'Computational and experimental work on ticagrelor reversal during emergency CABG.'
        points:
          - 'Built computational models simulating CytoSorb bead-incubation dynamics to optimise ticagrelor reversal.'
          - 'Designed and ran in-vitro assays including light-transmission aggregometry, VerifyNow, whole-blood single-platelet counting and flow cytometry.'
          - 'Refined incubation protocols by modelling drug–receptor dissociation kinetics to inform clinical strategy.'
          - 'Co-authored a peer-reviewed review on coronary thrombosis interventions as second author.'
        tags:
          - 'Cardiovascular research'
          - 'Computational modelling'
          - 'Flow cytometry'
          - 'Platelet function'
      - title: 'Founder and CEO'
        organisation: 'VW Schools'
        period: '2022–Present'
        badge: 'Medical education'
        summary: 'Founded a medical-education consultancy for aspiring medical students.'
        points:
          - 'Supported more than 300 aspiring medical students with structured application and interview preparation.'
          - 'Designed proprietary resources and managed operations.'
          - 'Achieved a 100% medical-school placement rate through structured systems, performance tracking and outcome-focused delivery.'
          - 'Built and deployed Vantage, an AI study coach using Python for personalised question generation, marking, progress tracking and spaced repetition.'
        tags:
          - 'Medical-school applications'
          - 'Medical education'
          - 'Operations'
          - 'Python'
        links:
          - label: 'Visit VW Schools'
            url: 'https://www.vwschools.co.uk'

